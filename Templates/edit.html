{{if .Success}}
    <h1>Thanks for your message!</h1>
    <a href="/">Return to homepage</a>
{{else}}
    <h1>{{.PageTitle}}</h1>
    <form method="POST">
        <label>Title</label><br />
        <input type="text" name="title" maxlength="256" value={{.Wines.Title}}><br />
        
        <label>Grape</label><br />
        <input type="text" name="grape" maxlength="256" value={{.Wines.Grape}}><br />

        <label>Origin</label><br />
        <input type="text" name="origin" maxlength="256" value={{.Wines.Origin}}><br />
        
        <label>Producer</label><br />
        <input type="text" name="producer" maxlength="256" value={{.Wines.Producer}}><br />
    
        <label>Vintage</label><br />
        <input type="number" name="vintage" min="0" max="2026" value={{.Wines.Vintage}}><br />
        
        <label>Taste</label><br />
        <input type="text" name="taste" maxlength="256" value={{.Wines.Taste}}><br />
        
        <label>Color</label><br />
        <input type="text" name="color" maxlength="256" value={{.Wines.Color}}><br />
        
        <label>Aroma</label><br />
        <input type="text" name="aroma" maxlength="256" value={{.Wines.Aroma}}><br />
        
        <label>Acidity</label><br /> 
        <input type="number" name="acidity" step="0.01" min="0" max="99.99" value={{.Wines.Acidity}}><br />
        
        <label>Sweetness</label><br />
        <input type="number" name="sweetness" step="0.01" min="0" max="99.99" value={{.Wines.Sweetness}}><br />
        
        <label>Price</label><br />
        <input type="number" name="price" step="0.01" min="0" max="99999.99" value={{.Wines.Price}}><br />
        
        <label>ISWineScale</label><br />
        <input type="number" name="isWineScale" step="0.1" min="0" max="10.0" value={{.Wines.ISWineScale}}><br />
        <input type="submit">
    </form>
{{end}}
